<svg xmlns="http://www.w3.org/2000/svg" width="730" height="268" viewBox="0 0 730 268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .t { fill:#000; font-size:15px; font-weight:600; text-anchor:middle; }
    .s { fill:#666; font-size:13px; text-anchor:middle; }
    .scope { fill:#F5F5F5; stroke:#000; stroke-width:1.4; }
    .base { fill:none; stroke:#000; stroke-width:1.8; }
    .tx { fill:#fff; stroke:#000; stroke-width:1.1; }
    .link { stroke:#000; stroke-width:1.4; fill:none; }
    .split { stroke:#E0E0E0; stroke-width:1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <g id="txs">
      <rect class="tx" x="0"  y="0" width="34" height="16"/>
      <rect class="tx" x="42" y="0" width="34" height="16"/>
      <rect class="tx" x="84" y="0" width="34" height="16"/>
    </g>
  </defs>

  <line class="split" x1="246" y1="14" x2="246" y2="254"/>
  <line class="split" x1="486" y1="14" x2="486" y2="254"/>

  <!-- SPC -->
  <text class="t" x="123" y="28">payment channel</text>
  <text class="s" x="123" y="48">Solana Private Channels</text>
  <rect class="scope" x="26" y="62" width="194" height="88" rx="8"/>
  <use href="#txs" x="64" y="80"/>
  <text class="s" x="123" y="120">operator runs it,</text>
  <text class="s" x="123" y="138">sees every transfer</text>
  <line class="link" x1="123" y1="150" x2="123" y2="188" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="base" x="26" y="192" width="194" height="34"/>
  <text class="t" x="123" y="214">Solana mainnet</text>
  <text class="s" x="123" y="248">escrow in, SMT-proof out</text>

  <!-- Tempo Zones -->
  <text class="t" x="366" y="28">parallel chain</text>
  <text class="s" x="366" y="48">Tempo Zones</text>
  <rect class="scope" x="269" y="62" width="194" height="88" rx="8"/>
  <use href="#txs" x="307" y="80"/>
  <text class="s" x="366" y="120">sender, recipient,</text>
  <text class="s" x="366" y="138">and the zone operator</text>
  <line class="link" x1="366" y1="150" x2="366" y2="188" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="base" x="269" y="192" width="194" height="34"/>
  <text class="t" x="366" y="214">Tempo L1</text>
  <text class="s" x="366" y="248">funds stay in an L1 contract</text>

  <!-- Pente -->
  <text class="t" x="608" y="28">privacy group</text>
  <text class="s" x="608" y="48">Pente</text>
  <rect class="scope" x="511" y="62" width="194" height="88" rx="8"/>
  <use href="#txs" x="549" y="80"/>
  <text class="s" x="608" y="120">an EVM per group,</text>
  <text class="s" x="608" y="138">members + endorsers only</text>
  <line class="link" x1="608" y1="150" x2="608" y2="188" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="base" x="511" y="192" width="194" height="34"/>
  <text class="t" x="608" y="214">base EVM ledger</text>
  <text class="s" x="608" y="248">masked commitments only</text>
</svg>
