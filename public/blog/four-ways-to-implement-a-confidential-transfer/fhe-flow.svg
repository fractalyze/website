<svg xmlns="http://www.w3.org/2000/svg" width="730" height="252" viewBox="0 0 730 252" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .t { fill:#000; font-size:15px; font-weight:600; text-anchor:middle; }
    .s { fill:#666; font-size:13px; text-anchor:middle; }
    .box { fill:#F5F5F5; stroke:#000; stroke-width:1.4; }
    .open { fill:#fff; stroke:#000; stroke-width:1.4; }
    .arrow { stroke:#000; stroke-width:1.6; fill:none; }
    .dash { stroke:#000; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
    .split { stroke:#E0E0E0; stroke-width:1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <line class="split" x1="425" y1="14" x2="425" y2="238"/>

  <text class="t" x="212" y="28">compute path</text>
  <rect class="open" x="30" y="46" width="364" height="58" rx="8"/>
  <text class="t" x="212" y="70">host chain (EVM)</text>
  <text class="s" x="212" y="92">contracts hold handles: h3 = h1 + h2, never values</text>
  <line class="arrow" x1="212" y1="104" x2="212" y2="146" marker-end="url(#a)"/>
  <text class="s" x="278" y="130">op event</text>
  <rect class="box" x="30" y="150" width="364" height="58" rx="8"/>
  <text class="t" x="212" y="174">coprocessors</text>
  <text class="s" x="212" y="196">run the TFHE math off-chain, post the result ciphertext</text>
  <text class="s" x="212" y="236">one global FHE public key for the whole chain</text>

  <text class="t" x="578" y="28">decrypt path</text>
  <rect class="open" x="456" y="46" width="244" height="44" rx="8"/>
  <text class="t" x="578" y="64">on-chain ACL</text>
  <text class="s" x="578" y="82">who may read which handle</text>
  <line class="arrow" x1="578" y1="90" x2="578" y2="112" marker-end="url(#a)"/>
  <rect class="box" x="456" y="116" width="244" height="44" rx="8"/>
  <text class="t" x="578" y="134">KMS: threshold MPC</text>
  <text class="s" x="578" y="152">key split across operators</text>
  <line class="dash" x1="578" y1="160" x2="578" y2="182" marker-end="url(#a)"/>
  <rect class="open" x="456" y="186" width="244" height="36" rx="8"/>
  <text class="t" x="578" y="209">authorized reader</text>
</svg>
