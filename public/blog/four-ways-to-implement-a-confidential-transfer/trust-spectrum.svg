<svg xmlns="http://www.w3.org/2000/svg" width="730" height="196" viewBox="0 0 730 196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .t { fill:#000; font-size:16px; font-weight:600; }
    .s { fill:#666; font-size:13px; }
    .b { fill:#000; font-size:14px; font-weight:600; text-anchor:middle; }
    .c { fill:#666; font-size:13px; text-anchor:middle; }
    .axis { stroke:#000; stroke-width:1.8; fill:none; }
    .node { fill:#F5F5F5; stroke:#000; stroke-width:1.4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <text class="t" x="8" y="26">Who can read a transfer, besides its counterparties</text>

  <text class="c" x="107" y="66">SPC &#183; Zones &#183; Pente</text>
  <rect class="node" x="28"  y="80" width="158" height="40" rx="6"/>
  <text class="b" x="107" y="105">an operator</text>

  <text class="c" x="285" y="66">Arc</text>
  <rect class="node" x="206" y="80" width="158" height="40" rx="6"/>
  <text class="b" x="285" y="105">attested hardware</text>

  <text class="c" x="463" y="66">Zama fhEVM</text>
  <rect class="node" x="384" y="80" width="158" height="40" rx="6"/>
  <text class="b" x="463" y="105">a key quorum</text>

  <text class="c" x="641" y="66">Railgun &#183; bongtu</text>
  <rect class="node" x="562" y="80" width="158" height="40" rx="6"/>
  <text class="b" x="641" y="105">counterparties</text>

  <line class="axis" x1="28" y1="152" x2="716" y2="152" marker-end="url(#a)"/>
  <text class="s" x="28" y="184">an organization holds plaintext</text>
  <text class="s" x="610" y="184" text-anchor="end">nobody extra does</text>
</svg>
