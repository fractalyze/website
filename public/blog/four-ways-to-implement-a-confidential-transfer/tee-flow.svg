<svg xmlns="http://www.w3.org/2000/svg" width="730" height="222" viewBox="0 0 730 222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .t { fill:#000; font-size:15px; font-weight:600; text-anchor:middle; }
    .s { fill:#666; font-size:13px; text-anchor:middle; }
    .box { fill:#F5F5F5; stroke:#000; stroke-width:1.4; }
    .open { fill:#fff; stroke:#000; stroke-width:1.4; }
    .enclave { fill:#fff; stroke:#000; stroke-width:2.2; }
    .arrow { stroke:#000; stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect class="box" x="16" y="66" width="168" height="76" rx="8"/>
  <text class="t" x="100" y="96">encrypted tx</text>
  <text class="s" x="100" y="118">X-Wing KEM</text>
  <text class="s" x="100" y="134">(X25519 + ML-KEM-768)</text>

  <line class="arrow" x1="184" y1="104" x2="248" y2="104" marker-end="url(#a)"/>
  <text class="s" x="216" y="92">calldata</text>

  <rect class="open" x="252" y="66" width="180" height="76" rx="8"/>
  <text class="t" x="342" y="96">privacy precompile</text>
  <text class="s" x="342" y="118">ledger sees: one call,</text>
  <text class="s" x="342" y="134">fixed gas, no logs</text>

  <line class="arrow" x1="432" y1="104" x2="496" y2="104" marker-end="url(#a)"/>

  <rect class="enclave" x="500" y="46" width="214" height="116" rx="10"/>
  <text class="t" x="607" y="76">validator enclave</text>
  <text class="s" x="607" y="100">decrypt, execute,</text>
  <text class="s" x="607" y="116">re-encrypt state</text>
  <text class="s" x="607" y="144">key: Shamir shares, rebuilt</text>
  <text class="s" x="607" y="158">only inside attested enclaves</text>

  <text class="s" x="365" y="204">everything left of the enclave is ciphertext; plaintext exists only inside the attested boundary</text>
</svg>
