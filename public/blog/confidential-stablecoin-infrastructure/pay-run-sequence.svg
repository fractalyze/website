<svg xmlns="http://www.w3.org/2000/svg" width="730" height="628" viewBox="0 0 730 628" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .box  { fill:none; stroke:#000; stroke-width:1.5; }
    .boxi { fill:#F5F5F5; stroke:#000; stroke-width:1.5; stroke-dasharray:5 4; }
    .life { stroke:#BBB; stroke-width:1.5; stroke-dasharray:4 4; }
    .arrow { stroke:#000; stroke-width:1.7; fill:none; }
    .h  { fill:#000; font-size:14px; font-weight:600; text-anchor:middle; }
    .hs { fill:#666; font-size:12px; text-anchor:middle; }
    .m  { fill:#000; font-size:14px; text-anchor:middle; }
    .n  { fill:#666; font-size:13px; text-anchor:middle; }
    .lg { fill:#666; font-size:13px; }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect class="box"  x="22"  y="12" width="126" height="50" rx="6"/>
  <rect class="boxi" x="167" y="12" width="126" height="50" rx="6"/>
  <rect class="box"  x="312" y="12" width="126" height="50" rx="6"/>
  <rect class="boxi" x="457" y="12" width="126" height="50" rx="6"/>
  <rect class="box"  x="598" y="12" width="120" height="50" rx="6"/>
  <text class="h"  x="85"  y="35">Employer</text><text class="hs" x="85"  y="53">console</text>
  <text class="h"  x="230" y="35">Proving</text><text class="hs" x="230" y="53">GPU service</text>
  <text class="h"  x="375" y="35">BongtuPool</text><text class="hs" x="375" y="53">on-chain</text>
  <text class="h"  x="520" y="35">Indexer</text><text class="hs" x="520" y="53">auditor key</text>
  <text class="h"  x="658" y="35">Recipient</text><text class="hs" x="658" y="53">wallet</text>

  <line class="life" x1="85"  y1="62" x2="85"  y2="576"/>
  <line class="life" x1="230" y1="62" x2="230" y2="576"/>
  <line class="life" x1="375" y1="62" x2="375" y2="576"/>
  <line class="life" x1="520" y1="62" x2="520" y2="576"/>
  <line class="life" x1="658" y1="62" x2="658" y2="576"/>

  <text class="m" x="230" y="102">deposit, in public</text>
  <line class="arrow" x1="85" y1="114" x2="371" y2="114" marker-end="url(#b)"/>

  <text class="m" x="157" y="160">256 recipients and amounts</text>
  <line class="arrow" x1="85" y1="172" x2="226" y2="172" marker-end="url(#b)"/>

  <text class="m" x="157" y="218">proof in 0.47 s on one GPU</text>
  <line class="arrow" x1="230" y1="230" x2="89" y2="230" marker-end="url(#b)"/>

  <text class="m" x="230" y="276">disburse: proof + ciphertext</text>
  <line class="arrow" x1="85" y1="288" x2="371" y2="288" marker-end="url(#b)"/>

  <text class="m" x="375" y="334">verify, inject auditor key, graft</text>
  <path class="arrow" d="M 375 346 h 36 v 20 h -32" marker-end="url(#b)"/>
  <text class="n" x="375" y="388">3,905,519 gas</text>

  <text class="m" x="447" y="426">events: commitments + ciphertext</text>
  <line class="arrow" x1="375" y1="438" x2="516" y2="438" marker-end="url(#b)"/>

  <text class="m" x="520" y="474">open envelopes, re-check the hash</text>
  <path class="arrow" d="M 520 486 h 36 v 20 h -32" marker-end="url(#b)"/>

  <text class="m" x="589" y="536">one signed request</text>
  <line class="arrow" x1="658" y1="548" x2="524" y2="548" marker-end="url(#b)"/>

  <text class="m" x="589" y="576">this owner's notes only</text>
  <line class="arrow" x1="520" y1="588" x2="654" y2="588" marker-end="url(#b)"/>

  <rect class="box"  x="22" y="606" width="14" height="12" rx="2"/>
  <text class="lg" x="44" y="617">public</text>
  <rect class="boxi" x="106" y="606" width="14" height="12" rx="2"/>
  <text class="lg" x="128" y="617">institution-internal: holds a key or sees plaintext</text>
</svg>
