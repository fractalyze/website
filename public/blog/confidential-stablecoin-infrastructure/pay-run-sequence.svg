<svg xmlns="http://www.w3.org/2000/svg" width="730" height="640" viewBox="0 0 730 640" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .box  { fill:none; stroke:#000; stroke-width:1.5; }
    .boxi { fill:#F5F5F5; stroke:#000; stroke-width:1.5; stroke-dasharray:5 4; }
    .life { stroke:#E0E0E0; stroke-width:1.5; stroke-dasharray:2 5; }
    .arrow { stroke:#000; stroke-width:1.6; fill:none; }
    .h  { fill:#000; font-size:13px; font-weight:600; text-anchor:middle; }
    .hs { fill:#666; font-size:11px; text-anchor:middle; }
    .m  { fill:#000; font-size:12.5px; text-anchor:middle; }
    .n  { fill:#666; font-size:11px; text-anchor:middle; }
    .lg { fill:#666; font-size:11px; }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- headers: lifelines at 85 / 230 / 375 / 520 / 655 -->
  <rect class="box"  x="22"  y="14" width="126" height="46" rx="6"/>
  <rect class="boxi" x="167" y="14" width="126" height="46" rx="6"/>
  <rect class="box"  x="312" y="14" width="126" height="46" rx="6"/>
  <rect class="boxi" x="457" y="14" width="126" height="46" rx="6"/>
  <rect class="box"  x="596" y="14" width="118" height="46" rx="6"/>
  <text class="h"  x="85"  y="35">Employer</text><text class="hs" x="85"  y="52">console</text>
  <text class="h"  x="230" y="35">Proving</text><text class="hs" x="230" y="52">service · GPU</text>
  <text class="h"  x="375" y="35">BongtuPool</text><text class="hs" x="375" y="52">on GIWA</text>
  <text class="h"  x="520" y="35">Indexer</text><text class="hs" x="520" y="52">auditor key</text>
  <text class="h"  x="655" y="35">Recipient</text><text class="hs" x="655" y="52">wallet</text>

  <line class="life" x1="85"  y1="60" x2="85"  y2="556"/>
  <line class="life" x1="230" y1="60" x2="230" y2="556"/>
  <line class="life" x1="375" y1="60" x2="375" y2="556"/>
  <line class="life" x1="520" y1="60" x2="520" y2="556"/>
  <line class="life" x1="655" y1="60" x2="655" y2="556"/>

  <!-- 1 deposit -->
  <text class="m" x="230" y="90">deposit: amount and sender are public</text>
  <line class="arrow" x1="85" y1="100" x2="371" y2="100" marker-end="url(#b)"/>
  <text class="n" x="230" y="116">the one public step, by design</text>

  <!-- 2 worksheet -->
  <text class="m" x="157" y="148">256 recipients + amounts</text>
  <line class="arrow" x1="85" y1="158" x2="226" y2="158" marker-end="url(#b)"/>
  <text class="n" x="157" y="174">institution-internal link</text>

  <!-- 3 proof -->
  <text class="m" x="157" y="206">proof: 0.47 s on one GPU</text>
  <line class="arrow" x1="230" y1="216" x2="89" y2="216" marker-end="url(#b)"/>
  <text class="n" x="157" y="232">2.8M constraints</text>

  <!-- 4 disburse -->
  <text class="m" x="230" y="264">disburse: proof + fixed-size ciphertext</text>
  <line class="arrow" x1="85" y1="274" x2="371" y2="274" marker-end="url(#b)"/>
  <text class="n" x="230" y="290">nothing readable on chain</text>

  <!-- 5 pool self -->
  <text class="m" x="375" y="322">verify · inject the auditor key · graft</text>
  <path class="arrow" d="M 375 332 h 34 v 18 h -30" marker-end="url(#b)"/>
  <text class="n" x="375" y="368">3,905,519 gas, measured live</text>

  <!-- 6 events -->
  <text class="m" x="452" y="400">events: commitments + ciphertext</text>
  <line class="arrow" x1="375" y1="410" x2="516" y2="410" marker-end="url(#b)"/>
  <text class="n" x="452" y="426">public</text>

  <!-- 7 indexer self -->
  <text class="m" x="520" y="458">open envelopes · re-check the hash</text>
  <path class="arrow" d="M 520 468 h 34 v 18 h -30" marker-end="url(#b)"/>
  <text class="n" x="520" y="504">alarm on any mismatch</text>

  <!-- 8 read -->
  <text class="m" x="588" y="530">one signed request</text>
  <line class="arrow" x1="655" y1="540" x2="524" y2="540" marker-end="url(#b)"/>
  <text class="m" x="588" y="562">this owner's notes only</text>
  <line class="arrow" x1="520" y1="572" x2="651" y2="572" marker-end="url(#b)"/>
  <text class="n" x="588" y="588">no pool-wide scan</text>

  <!-- legend -->
  <rect class="box"  x="22" y="620" width="14" height="11" rx="2"/>
  <text class="lg" x="42" y="630">public</text>
  <rect class="boxi" x="96" y="620" width="14" height="11" rx="2"/>
  <text class="lg" x="116" y="630">institution-internal: holds a key or sees plaintext</text>
</svg>
