<svg xmlns="http://www.w3.org/2000/svg" width="730" height="330" viewBox="0 0 730 330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .cell  { fill:none; stroke:#000; stroke-width:1.2; }
    .cellf { fill:#000; stroke:#000; stroke-width:1.2; }
    .arrow { stroke:#000; stroke-width:1.8; fill:none; }
    .split { stroke:#E0E0E0; stroke-width:1.5; }
    .t { fill:#000; font-size:13px; font-weight:600; }
    .s { fill:#666; font-size:11.5px; }
    .b { fill:#000; font-size:12.5px; }
    .n { fill:#666; font-size:12px; }
    .lbl { fill:#666; font-size:11px; text-anchor:middle; }
  </style>
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- stage 1: 20 notes, 5 x 4 at (8,74), pitch 20 -->
  <text class="t" x="8" y="30">Balance held</text>
  <text class="s" x="8" y="50">20 notes</text>
  <g class="cell">
    <rect x="8"  y="74" width="14" height="14"/><rect x="28" y="74" width="14" height="14"/><rect x="48" y="74" width="14" height="14"/><rect x="68" y="74" width="14" height="14"/><rect x="88" y="74" width="14" height="14"/>
    <rect x="8"  y="94" width="14" height="14"/><rect x="28" y="94" width="14" height="14"/><rect x="48" y="94" width="14" height="14"/><rect x="68" y="94" width="14" height="14"/><rect x="88" y="94" width="14" height="14"/>
    <rect x="8"  y="114" width="14" height="14"/><rect x="28" y="114" width="14" height="14"/><rect x="48" y="114" width="14" height="14"/><rect x="68" y="114" width="14" height="14"/><rect x="88" y="114" width="14" height="14"/>
    <rect x="8"  y="134" width="14" height="14"/><rect x="28" y="134" width="14" height="14"/><rect x="48" y="134" width="14" height="14"/><rect x="68" y="134" width="14" height="14"/><rect x="88" y="134" width="14" height="14"/>
  </g>

  <text class="lbl" x="146" y="98">fold 1</text>
  <line class="arrow" x1="118" y1="110" x2="174" y2="110" marker-end="url(#e)"/>

  <!-- stage 2: 11 notes -->
  <text class="t" x="192" y="30">After fold 1</text>
  <text class="s" x="192" y="50">11 notes</text>
  <g class="cell">
    <rect x="192" y="74" width="14" height="14"/><rect x="212" y="74" width="14" height="14"/><rect x="232" y="74" width="14" height="14"/><rect x="252" y="74" width="14" height="14"/><rect x="272" y="74" width="14" height="14"/>
    <rect x="192" y="94" width="14" height="14"/><rect x="212" y="94" width="14" height="14"/><rect x="232" y="94" width="14" height="14"/><rect x="252" y="94" width="14" height="14"/><rect x="272" y="94" width="14" height="14"/>
    <rect x="192" y="114" width="14" height="14"/>
  </g>

  <text class="lbl" x="330" y="98">fold 2</text>
  <line class="arrow" x1="302" y1="110" x2="358" y2="110" marker-end="url(#e)"/>

  <!-- stage 3: 2 notes -->
  <text class="t" x="376" y="30">After fold 2</text>
  <text class="s" x="376" y="50">2 notes</text>
  <g class="cell">
    <rect x="376" y="74" width="14" height="14"/><rect x="396" y="74" width="14" height="14"/>
  </g>

  <text class="lbl" x="482" y="98">payment</text>
  <line class="arrow" x1="440" y1="110" x2="524" y2="110" marker-end="url(#e)"/>

  <!-- stage 4 -->
  <text class="t" x="542" y="30">Payment sent</text>
  <text class="s" x="542" y="50">one note out,</text>
  <text class="s" x="542" y="68">one change note back</text>
  <rect class="cellf" x="542" y="88" width="14" height="14"/>
  <rect class="cell"  x="562" y="88" width="14" height="14"/>

  <line class="split" x1="8" y1="188" x2="722" y2="188"/>
  <text class="b" x="8" y="216">Each fold is one 10-in / 2-out transaction: the ten largest notes become one, at 3,053,435 gas.</text>
  <text class="n" x="8" y="244">The wallet selects largest-first and plans the whole path up front, so the user presses Confirm once and</text>
  <text class="n" x="8" y="266">reads what it costs: "your balance is in 20 pieces, so this takes 3 approvals."</text>
</svg>
