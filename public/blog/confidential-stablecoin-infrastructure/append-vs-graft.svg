<svg xmlns="http://www.w3.org/2000/svg" width="730" height="248" viewBox="0 0 730 248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .cell { fill:none; stroke:#000; stroke-width:1.2; }
    .tri  { fill:#F5F5F5; stroke:#000; stroke-width:1.8; stroke-linejoin:round; }
    .trio { fill:none; stroke:#000; stroke-width:1.8; stroke-linejoin:round; }
    .arrow { stroke:#000; stroke-width:1.8; fill:none; }
    .split { stroke:#E0E0E0; stroke-width:1.5; }
    .t { fill:#000; font-size:16px; font-weight:600; }
    .s { fill:#666; font-size:14px; }
    .b { fill:#000; font-size:15px; font-weight:600; }
    .cap { fill:#666; font-size:13px; text-anchor:middle; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <line class="split" x1="365" y1="10" x2="365" y2="238"/>

  <text class="t" x="8" y="34">Append them one by one</text>
  <text class="s" x="8" y="60">O(256) hashes on chain</text>
  <g class="cell">
    <g id="r">
      <rect x="8"   y="84" width="14" height="14"/><rect x="27"  y="84" width="14" height="14"/><rect x="46"  y="84" width="14" height="14"/><rect x="65"  y="84" width="14" height="14"/><rect x="84"  y="84" width="14" height="14"/><rect x="103" y="84" width="14" height="14"/><rect x="122" y="84" width="14" height="14"/><rect x="141" y="84" width="14" height="14"/><rect x="160" y="84" width="14" height="14"/><rect x="179" y="84" width="14" height="14"/><rect x="198" y="84" width="14" height="14"/><rect x="217" y="84" width="14" height="14"/><rect x="236" y="84" width="14" height="14"/><rect x="255" y="84" width="14" height="14"/><rect x="274" y="84" width="14" height="14"/><rect x="293" y="84" width="14" height="14"/>
    </g>
    <use href="#r" y="19"/>
    <use href="#r" y="38"/>
    <use href="#r" y="57"/>
  </g>
  <text class="b" x="8" y="196">Does not fit in a block.</text>

  <text class="t" x="389" y="34">Prove one depth-8 subtree</text>
  <text class="s" x="389" y="60">O(log 256) hashes on chain</text>

  <path class="tri" d="M 452 88 L 508 156 L 396 156 Z"/>
  <text class="cap" x="452" y="178">256 new notes</text>
  <line class="arrow" x1="524" y1="124" x2="558" y2="124" marker-end="url(#c)"/>
  <path class="trio" d="M 640 82 L 706 156 L 574 156 Z"/>
  <path class="tri" d="M 640 130 L 654 148 L 626 148 Z" style="stroke-width:1.3"/>
  <text class="cap" x="640" y="178">grafted in one step</text>

  <text class="b" x="389" y="222">15,256 gas per recipient.</text>
</svg>
