<svg xmlns="http://www.w3.org/2000/svg" width="730" height="212" viewBox="0 0 730 212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .box { fill:none; stroke:#000; stroke-width:1.5; }
    .tri { fill:none; stroke:#000; stroke-width:1.8; stroke-linejoin:round; }
    .leaf { fill:#000; }
    .leafh { fill:#fff; stroke:#000; stroke-width:1.3; }
    .arrow { stroke:#000; stroke-width:1.8; fill:none; }
    .t { fill:#000; font-size:16px; font-weight:600; }
    .s { fill:#666; font-size:14px; }
    .c { fill:#000; font-size:13px; font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .cap { fill:#666; font-size:13px; text-anchor:middle; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect class="box" x="8" y="40" width="210" height="110" rx="8"/>
  <text class="t" x="26" y="76">One sealed note</text>
  <text class="c" x="26" y="112">commit(amount, owner)</text>
  <text class="cap" x="113" y="182">what money is</text>

  <line class="arrow" x1="228" y1="95" x2="254" y2="95" marker-end="url(#a)"/>

  <path class="tri" d="M 365 46 L 430 150 L 300 150 Z"/>
  <circle class="leaf"  cx="316" cy="140" r="4.5"/>
  <circle class="leafh" cx="336" cy="140" r="4.5"/>
  <circle class="leafh" cx="356" cy="140" r="4.5"/>
  <circle class="leaf"  cx="376" cy="140" r="4.5"/>
  <circle class="leafh" cx="396" cy="140" r="4.5"/>
  <circle class="leafh" cx="416" cy="140" r="4.5"/>
  <text class="cap" x="365" y="182">one shared tree, filled leaves are yours</text>

  <line class="arrow" x1="476" y1="95" x2="502" y2="95" marker-end="url(#a)"/>

  <rect class="box" x="512" y="40" width="210" height="110" rx="8"/>
  <text class="t" x="530" y="72">To spend it</text>
  <text class="s" x="530" y="104">prove you own notes</text>
  <text class="s" x="530" y="126">covering the amount</text>
  <text class="cap" x="617" y="182">how money moves</text>
</svg>
