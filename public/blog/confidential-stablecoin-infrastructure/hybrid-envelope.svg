<svg xmlns="http://www.w3.org/2000/svg" width="730" height="470" viewBox="0 0 730 470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .box  { fill:none; stroke:#000; stroke-width:1.5; }
    .boxf { fill:#F5F5F5; stroke:#000; stroke-width:1.5; }
    .boxd { fill:none; stroke:#BBB; stroke-width:1.5; stroke-dasharray:5 4; }
    .arrow { stroke:#000; stroke-width:1.6; fill:none; }
    .arrowm { stroke:#999; stroke-width:1.4; fill:none; stroke-dasharray:4 4; }
    .t { fill:#000; font-size:13.5px; font-weight:600; }
    .s { fill:#666; font-size:11.5px; }
    .m { fill:#000; font-size:12.5px; }
    .n { fill:#666; font-size:11.5px; }
  </style>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="dm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <!-- two input secrets -->
  <rect class="box" x="8" y="30" width="216" height="78" rx="7"/>
  <text class="t" x="24" y="56">Classical half</text>
  <text class="s" x="24" y="78">ECDH shared secret. Both</text>
  <text class="s" x="24" y="96">public halves sit on chain</text>

  <rect class="box" x="8" y="150" width="216" height="78" rx="7"/>
  <text class="t" x="24" y="176">Post-quantum half</text>
  <text class="s" x="24" y="198">ML-KEM-768 encapsulation</text>
  <text class="s" x="24" y="216">secret, the NIST standard</text>

  <!-- into one hash -->
  <line class="arrow" x1="228" y1="66" x2="266" y2="106" marker-end="url(#d)"/>
  <line class="arrow" x1="228" y1="192" x2="266" y2="152" marker-end="url(#d)"/>
  <rect class="box" x="272" y="90" width="164" height="78" rx="7"/>
  <text class="t" x="288" y="116">Envelope key</text>
  <text class="s" x="288" y="138">one hash over both</text>
  <text class="s" x="288" y="156">secrets and the transcript</text>

  <!-- ciphertext -->
  <line class="arrow" x1="440" y1="129" x2="478" y2="129" marker-end="url(#d)"/>
  <rect class="boxf" x="484" y="72" width="238" height="114" rx="7"/>
  <text class="t" x="500" y="98">Auditor ciphertext</text>
  <text class="s" x="500" y="120">published on chain with the</text>
  <text class="s" x="500" y="138">payout, carries the whole</text>
  <text class="s" x="500" y="156">operation, kept forever by</text>
  <text class="s" x="500" y="174">anyone watching</text>

  <!-- proof binds the PQ half -->
  <path class="arrow" d="M 354 226 v -50" marker-end="url(#d)"/>
  <rect class="box" x="240" y="230" width="292" height="60" rx="7"/>
  <text class="m" x="256" y="254">The proof commits to the PQ secret</text>
  <text class="n" x="256" y="276">so a sender cannot skip the lattice half</text>

  <line class="arrowm" x1="622" y1="186" x2="640" y2="330" marker-end="url(#dm)"/>

  <!-- adversary strip -->
  <rect class="boxd" x="8" y="336" width="714" height="88" rx="7"/>
  <text class="m" x="26" y="364">Harvest now, decrypt later: an adversary records the ciphertext today</text>
  <text class="m" x="26" y="386">and waits for quantum hardware.</text>
  <text class="n" x="26" y="410">Breaking the classical half then yields one input to the hash and opens nothing.</text>
</svg>
